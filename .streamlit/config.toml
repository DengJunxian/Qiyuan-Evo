[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#a8caff"
backgroundColor = "#111a2a"
secondaryBackgroundColor = "#182439"
textColor = "#eef2f8"
borderColor = "#33425a"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"

[theme.sidebar]
primaryColor = "#a8caff"
backgroundColor = "#182439"
secondaryBackgroundColor = "#24334a"
textColor = "#eef2f8"
borderColor = "#33425a"
showWidgetBorder = true

[server]
headless = true
showEmailPrompt = false
enableStaticServing = true
